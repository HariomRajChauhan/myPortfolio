[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# REPLACE the host below with your Render service URL before deploying.
# It looks like: https://hariom-portfolio-api.onrender.com
# ---------------------------------------------------------------------------

# Proxy API calls + uploaded images to the Render backend.
# Declared BEFORE the SPA fallback: Netlify evaluates rules top to bottom.
# A rewrite (status 200) keeps the browser on your domain, which means
# relative image paths stored as /api/images/<id> keep working and no CORS
# is involved at all.
[[redirects]]
  from = "/api/*"
  to = "https://hariom-portfolio-api.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so refreshing /blogs/my-post does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for the static site.
# CSP allows: self-hosted bundles, inline styles (React style props + highlight.js),
# Google Fonts, remote images (YouTube thumbnails, Cloudinary), and YouTube embeds.
# connect-src stays 'self' because all API calls go through the /api proxy above.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-src https://www.youtube.com https://www.youtube-nocookie.com; form-action 'self'; upgrade-insecure-requests"
