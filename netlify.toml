[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# REPLACE the host below with your Render service URL before deploying.
# It looks like: https://hariom-portfolio-api.onrender.com
# ---------------------------------------------------------------------------

# Proxy API calls + uploaded images to the Render backend.
# Declared BEFORE the SPA fallback: Netlify evaluates rules top to bottom.
# A rewrite (status 200) keeps the browser on your domain, which means
# relative image paths stored as /api/images/<id> keep working and no CORS
# is involved at all.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE-WITH-YOUR-SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so refreshing /blogs/my-post does not 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
